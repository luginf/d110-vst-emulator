name: Build Windows

# CI/infra branch only - never wired to main or linux-port. Manual re-runs via
# workflow_dispatch once this is stable; do not change this to a bare `push:` trigger.
#
# D110EmulatorNative only: the MAME-backed D110Emulator is opt-in
# (-DD110_BUILD_MAME_BACKEND=ON, see plugin/CMakeLists.txt) and kept out of CI on purpose -
# building MAME itself was the entire source of pain here (a real MAME source bug needing a
# patch, then the runner's VS version drifting out from under a hardcoded generator). The
# native core needs none of that: no MAME dependency at all.
on:
  push:
    branches: [ci/windows-macos-builds]
  workflow_dispatch:

# A later push while a run from an earlier one is still going superseded it anyway -
# don't burn double runner time on both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout d110-vst-emulator
        uses: actions/checkout@v4

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache JUCE FetchContent checkout
        uses: actions/cache@v4
        with:
          path: plugin/build/_deps/juce-src
          key: juce-8.0.15-windows-native-v1

      - name: Configure plugin
        # Ninja Multi-Config instead of a hardcoded "Visual Studio 17 2022" generator: the
        # runner's installed VS version drifts (confirmed by CI - a run failed here with
        # "could not find any instance of Visual Studio" once the image moved to VS 18), and
        # Ninja just uses whatever cl.exe/link.exe msvc-dev-cmd already put on PATH above,
        # so it isn't tied to a specific VS version string at all. Multi-Config (not plain
        # Ninja) keeps `--config Release` below working the same as it would with the VS
        # generator.
        working-directory: plugin
        shell: cmd
        run: |
          cmake -S . -B build -G "Ninja Multi-Config"

      - name: Build D110EmulatorNative (VST3 + Standalone)
        working-directory: plugin
        shell: cmd
        run: |
          cmake --build build --config Release --target D110EmulatorNative_VST3 D110EmulatorNative_Standalone

      - name: Locate build outputs
        shell: bash
        run: |
          echo "--- VST3 bundles ---"
          find plugin/build -iname "*.vst3" -maxdepth 6
          echo "--- Standalone exes ---"
          find plugin/build -iname "*.exe" -path "*Standalone*"

      - name: Upload VST3 plugin
        uses: actions/upload-artifact@v4
        with:
          name: d110-native-windows-vst3
          path: plugin/build/**/*.vst3
          if-no-files-found: error

      - name: Upload Standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: d110-native-windows-standalone
          path: plugin/build/**/Standalone/*.exe
          if-no-files-found: error
