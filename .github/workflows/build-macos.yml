name: Build macOS

# CI/infra branch only - never wired to main or linux-port. Manual re-runs via
# workflow_dispatch once this is stable; do not change this to a bare `push:` trigger.
#
# D110EmulatorNative only (VST3 + Standalone + AU): the MAME-backed D110Emulator is opt-in
# (-DD110_BUILD_MAME_BACKEND=ON, see plugin/CMakeLists.txt) and kept out of CI on purpose -
# building MAME itself was the entire source of pain here (SDL3 OSD quirks, a duplicate-symbol
# fight with ld64). The native core needs none of that: no MAME dependency at all, and no
# code-signing/notarization either - unsigned builds will be Gatekeeper-blocked by default on
# anyone's own Mac unless they right-click -> Open, or the project gets an Apple Developer
# account for notarization later.
on:
  push:
    branches: [ci/windows-macos-builds]
  workflow_dispatch:

# A later push while a run from an earlier one is still going superseded it anyway -
# don't burn double runner time on both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout d110-vst-emulator
        uses: actions/checkout@v4

      - name: Cache JUCE FetchContent checkout
        uses: actions/cache@v4
        with:
          path: plugin/build/_deps/juce-src
          key: juce-8.0.15-macos-native-v1

      - name: Configure plugin
        working-directory: plugin
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: "Build D110EmulatorNative (VST3 + Standalone + AU)"
        working-directory: plugin
        run: |
          cmake --build build --config Release --target D110EmulatorNative_VST3 D110EmulatorNative_Standalone D110EmulatorNative_AU -j"$(sysctl -n hw.ncpu)"

      - name: Locate build outputs
        if: always()
        run: |
          echo "--- VST3 bundles ---"
          find plugin/build -iname "*.vst3" -maxdepth 6 2>/dev/null
          echo "--- AU components ---"
          find plugin/build -iname "*.component" -maxdepth 6 2>/dev/null
          echo "--- Standalone apps ---"
          find plugin/build -iname "*.app" -path "*Standalone*" -maxdepth 6 2>/dev/null

      - name: Upload VST3 plugin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d110-native-macos-vst3
          path: plugin/build/**/*.vst3
          if-no-files-found: warn

      - name: Upload AU component
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d110-native-macos-au
          path: plugin/build/**/*.component
          if-no-files-found: warn

      - name: Upload Standalone app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d110-native-macos-standalone
          path: plugin/build/**/Standalone/*.app
          if-no-files-found: warn
