name: Build macOS

# CI/infra branch only - never wired to main or linux-port. Manual re-runs via
# workflow_dispatch once this is stable; do not change this to a bare `push:` trigger.
#
# D110EmulatorNative only (VST3 + Standalone + AU): the MAME-backed D110Emulator is opt-in
# (-DD110_BUILD_MAME_BACKEND=ON, see plugin/CMakeLists.txt) and kept out of CI on purpose -
# building MAME itself was the entire source of pain here (SDL3 OSD quirks, a duplicate-symbol
# fight with ld64). The native core needs none of that: no MAME dependency at all, and no
# code-signing/notarization either - unsigned builds will be Gatekeeper-blocked by default on
# anyone's own Mac unless they right-click -> Open, or the project gets an Apple Developer
# account for notarization later.
on:
  push:
    branches: [ci/windows-macos-builds]
  workflow_dispatch:

# A later push while a run from an earlier one is still going superseded it anyway -
# don't burn double runner time on both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout d110-vst-emulator
        uses: actions/checkout@v4

      - name: Cache JUCE FetchContent checkout
        uses: actions/cache@v4
        with:
          path: plugin/build/_deps/juce-src
          key: juce-8.0.15-macos-native-v1

      # Universal binary (arm64 + x86_64) in one build, on the same free
      # standard macos-latest runner - Alan asked for Intel Mac support,
      # 2026-09-03. macos-latest is Apple Silicon (arm64) now, and GitHub
      # dropped free/standard Intel macOS runners entirely: the only Intel
      # option left is a "large" runner SKU, billed per minute even on
      # public repos (see docs/README's own note on this). Xcode's own
      # toolchain on an arm64 host can already cross-compile the x86_64
      # slice without any Intel hardware at all - CMAKE_OSX_ARCHITECTURES
      # just asks the linker for both, `lipo`-ing them into one Mach-O.
      # Confirmed nothing in this tree needs per-architecture code (no
      # -march=native, no NEON/SSE intrinsics anywhere in plugin/CMakeLists.txt
      # or munt's own CMake) - plain portable C++ throughout, so there is no
      # reason this ever needs two separate jobs.
      # CMAKE_OSX_DEPLOYMENT_TARGET must be set explicitly - left unset, CMake
      # embeds the runner's own (very recent) SDK default as the minimum
      # supported macOS version, so the resulting binary is Gatekeeper-refused
      # ("You can't use this version of the application with this version of
      # macOS") on anything older, e.g. Ventura 13.7 - reported by a user on
      # a fresh universal-binary build, 2026-09-03. 11.0 (Big Sur) is the
      # practical floor for a universal binary: arm64 Macs don't exist on
      # anything older, so there's no point targeting lower for the x86_64 slice.
      - name: Configure plugin
        working-directory: plugin
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: "Build D110EmulatorNative (VST3 + Standalone + AU)"
        working-directory: plugin
        run: |
          cmake --build build --config Release --target D110EmulatorNative_VST3 D110EmulatorNative_Standalone D110EmulatorNative_AU -j"$(sysctl -n hw.ncpu)"

      - name: Locate build outputs
        if: always()
        run: |
          echo "--- VST3 bundles ---"
          find plugin/build -iname "*.vst3" -maxdepth 6 2>/dev/null
          echo "--- AU components ---"
          find plugin/build -iname "*.component" -maxdepth 6 2>/dev/null
          echo "--- Standalone apps ---"
          find plugin/build -iname "*.app" -path "*Standalone*" -maxdepth 6 2>/dev/null

      - name: Upload VST3 plugin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d110-native-macos-vst3
          path: plugin/build/**/*.vst3
          if-no-files-found: warn

      - name: Upload AU component
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d110-native-macos-au
          path: plugin/build/**/*.component
          if-no-files-found: warn

      - name: Upload Standalone app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d110-native-macos-standalone
          path: plugin/build/**/Standalone/*.app
          if-no-files-found: warn
