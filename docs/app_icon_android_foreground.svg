  <!-- Foreground layer for Android's adaptive icon (res/mipmap-anydpi-v26/ic_launcher.xml).
       Same "D-110" wordmark group as app_icon.svg's own g4, transparent background (the flat
       #101012 fill is the separate adaptive-icon background layer, @color/ic_launcher_background),
       rescaled/recentred so its bounding box sits inside the ~66dp safe-zone circle launchers
       guarantee visible on a 108dp adaptive-icon canvas (app_icon.svg's g4 measures
       x=12.38 y=157.76 w=486.15 h=182.30 - edge-to-edge, fine for a square window/taskbar icon
       but clipped hard by any round/squircle mask). Outer wrapper below is
       translate(89.95,94.21) scale(0.65) applied on top of g4's own transform, chosen so
       g4's bbox maps onto a centred box inscribed in that safe circle - regenerate by hand if
       app_icon.svg's g4 content or transform ever changes. Rendered to
       android/app/src/main/res/drawable/ic_launcher_foreground.png via Inkscape. -->
  <g id="safe-zone-wrap" transform="translate(89.95,94.21) scale(0.65)">
