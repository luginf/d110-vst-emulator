  <!-- App/window icon: the D-110 front panel's own "D-110" wordmark (see panel_reference.png,
       the "Roland D-110" text next to the PHONES jack), vectorised by hand from that photo
       rather than upscaling a screenshot crop of it - flat colour, no compression artefacts,
       scales cleanly from a launcher icon down to a titlebar-sized one. Used for both the
       Android launcher icon (android/app/src/main/res/drawable/icon.png) and the desktop
       Standalone/VST3 window icon (ICON_BIG/ICON_SMALL in plugin/CMakeLists.txt) - same
       source, re-rendered per target rather than kept in sync by hand. -->
